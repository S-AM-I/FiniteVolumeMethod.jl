# Docker Compose for local CI — FiniteVolumeMethod.jl
#
# Usage:
#   docker-compose build base          # Build base image (first time / after Project.toml changes)
#   docker-compose run --rm test       # Full test suite
#   docker-compose run --rm format     # Check formatting
#   docker-compose run --rm repl       # Interactive REPL
#
# Override locally via docker-compose.override.yml (gitignored).

x-common: &common
  build:
    context: .
    dockerfile: docker/Dockerfile.base
    args:
      JULIA_VERSION: "1.11"
  image: fvm-base:latest
  volumes:
    - .:/workspace
    - fvm-julia-depot:/julia-depot
  environment: &env
    JULIA_DEPOT_PATH: /julia-depot
    JULIA_NUM_THREADS: auto
  working_dir: /workspace

services:
  # Build the base image (pre-compiled deps)
  base:
    <<: *common
    profiles: [build]
    command: julia --project -e 'println("Base image ready.")'

  # Full test suite — mirrors the disabled GitHub CI template in .github/workflows/CI.yml.disabled
  test:
    <<: *common
    environment:
      <<: *env
      JULIA_REFERENCETESTS_UPDATE: "true"
    command: >-
      bash -c 'julia --project -e "using Pkg; Pkg.resolve(); Pkg.instantiate()" &&
      julia --project -e "using Pkg; Pkg.test()"'

  # Single test file — fast iteration
  # Usage: TEST_FILE=test/geometry.jl docker-compose run --rm test-file
  test-file:
    <<: *common
    environment:
      <<: *env
      JULIA_REFERENCETESTS_UPDATE: "true"
      TEST_FILE: ${TEST_FILE:-test/geometry.jl}
    command: >-
      bash -c 'julia --project=test -e "using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.resolve(); Pkg.instantiate()" &&
      julia --project=test -e "using FiniteVolumeMethod, Test; @testset \"$$TEST_FILE\" begin include(\"$$TEST_FILE\") end"'

  # Runic format check — mirrors the disabled GitHub format template in .github/workflows/FormatCheck.yml.disabled
  format:
    <<: *common
    mem_limit: 2g
    command: >-
      julia -e '
        using Pkg;
        Pkg.activate("runic"; shared=true);
        using Runic;
        exit(Runic.main(["--check", "."]))'

  # Runic auto-fix formatting
  format-fix:
    <<: *common
    mem_limit: 2g
    command: >-
      julia -e '
        using Pkg;
        Pkg.activate("runic"; shared=true);
        using Runic;
        exit(Runic.main(["--inplace", "."]))'

  # Full docs build with executed examples
  docs:
    <<: *common
    environment:
      <<: *env
      CI: "false"
      FVM_DOCS_EXECUTION: "all"
    command: >-
      bash -c 'julia --project -e "using Pkg; Pkg.resolve(); Pkg.instantiate()" &&
      julia --project=docs -e "using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.resolve(); Pkg.instantiate()" &&
      julia --project=docs docs/make.jl'

  # CI-like docs build — executes the curated subset used in CI
  docs-ci:
    <<: *common
    environment:
      <<: *env
      CI: "true"
      FVM_DOCS_EXECUTION: "subset"
    command: >-
      bash -c 'julia --project -e "using Pkg; Pkg.resolve(); Pkg.instantiate()" &&
      julia --project=docs -e "using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.resolve(); Pkg.instantiate()" &&
      julia --project=docs docs/make.jl'

  # Curated scientific-evidence suite — mirrors CI evidence lane
  evidence:
    <<: *common
    command: >-
      bash -c 'julia --project=test -e "using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.resolve(); Pkg.instantiate()" &&
      julia --project=test test/scientific_evidence.jl'

  # Executed validation report with machine-readable summaries
  report:
    <<: *common
    command: >-
      bash -c 'julia --project=. scripts/verification_validation_report.jl'

  # Reproduction bundles for all evidence-bearing solver families
  bundles:
    <<: *common
    command: >-
      bash -c 'julia --project=. scripts/build_reproduction_bundles.jl'

  # Interactive Julia REPL
  repl:
    <<: *common
    mem_limit: 8g
    stdin_open: true
    tty: true
    command: >-
      bash -c 'julia --project -e "using Pkg; Pkg.resolve(); Pkg.instantiate()" &&
      julia --project'

volumes:
  fvm-julia-depot:
