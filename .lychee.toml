# lychee link-checker config — shared across the three sister repos.
# https://lychee.cli.rs/usage/config/

# Skip sluggish or rate-limited hosts that cause flaky CI runs.
exclude = [
  # GitHub PR/issue links — frequently rate-limited, low signal.
  '^https://github\.com/.+/(pull|issues)/\d+$',
  # Zenodo DOIs — these resolve through one redirect and rate-limit.
  '^https://zenodo\.org/',
  '^https://doi\.org/10\.5281/',
  # Documenter cross-references — `(@ref)` resolves at build time, so lychee
  # sees a literal `@ref` filesystem path before Documenter has a chance to
  # rewrite it. Excluded from the raw-markdown sweep.
  '@ref',
  # Sister-repo docs sites that have not been published yet. Drop these
  # exclusions once the corresponding gh-pages branches go live.
  '^https://cx-xd\.github\.io/(FiniteVolumeMethod|NuclearWaterChemistry)\.jl',
  '^https://s-am-i\.github\.io/CRUD\.jl',
  # Publisher endpoints that reject scraper user-agents with 403, even
  # though the canonical DOI/URL is correct.
  '^https://doi\.org/10\.1063/',
  '^https://(epubs\.siam\.org|pubs\.aip\.org)/',
  # Broken historical citation. Original target wiki page no longer exists;
  # left in the docs as an attribution comment.
  '^https?://onelab\.info/wiki/',
]

# Treat localhost / 127.0.0.1 as fine (used in dev-server links).
exclude_loopback = true

# Be patient on slow hosts.
timeout = 30

# Don't follow redirects more than 5 deep.
max_redirects = 5

# Cache successful checks across runs (the action also has a cache option).
cache = true
max_cache_age = "1d"
