  "Evidence #3 (v3.38): `test/v_and_v_komega.jl` — Wilcox k-ω model algebra. Five testsets, 88 gates: (1) ν_t = k/ω algebraic identity at 64 cells to rtol 1e-12; (2) homogeneous realizability and monotone decay; (3) ω(t) = ω₀/(1 + β·ω₀·t) analytical match to rtol 2e-2 at dt = 5e-4; (4) k decays faster than ω (β*·ω > β·ω); (5) post-decay ν_t = k_final/ω_final identity.",
  "Evidence #4 (v3.44): `test/v_and_v_spalart_allmaras.jl` — Spalart-Allmaras one-equation closure. Five testsets, 108 gates: (1) ν̃ = 0 ⇒ ν_t = 0; (2) high-χ limit ν_t → ν̃·fv1 with fv1 > 0.9999; (3) low-χ limit ν_t → ν̃·χ³/cv1³ with fv1 < 1e-10; (4) ν_t monotone in ν̃ at fixed ν (plus realizability); (5) fv1(χ) = χ³/(χ³+cv1³) closed-form to rtol 1e-14 at six χ points. Puts `turbulence_rans` at four convergence-verified benchmarks covering all three canonical RANS families (k-ε, k-ω, Spalart-Allmaras).",
