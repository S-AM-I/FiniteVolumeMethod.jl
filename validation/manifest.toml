  "Evidence #6 (v3.66): `test/v_and_v_rans_state.jl` — RANSTurbulenceState container + model dispatch. Seven testsets, 190 gates: (1) k-ε field names (:k, :epsilon) and count 2; (2) k-ω field names (:k, :omega) and count 2; (3) SA field (:nu_tilde) and count 1; (4) default zero-ish (1e-6) init with size matching mesh (131 cells); (5) custom init kwargs round-trip; (6) KOmega + SA dispatch via AbstractRANSModel; (7) k-ω state has :omega not :epsilon key.",
