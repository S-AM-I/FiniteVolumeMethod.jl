  "Evidence #4 (v3.44): `test/v_and_v_spalart_allmaras.jl` — Spalart-Allmaras one-equation closure. Five testsets, 108 gates: (1) ν̃ = 0 ⇒ ν_t = 0; (2) high-χ limit ν_t → ν̃·fv1 with fv1 > 0.9999; (3) low-χ limit ν_t → ν̃·χ³/cv1³ with fv1 < 1e-10; (4) ν_t monotone in ν̃ at fixed ν (plus realizability); (5) fv1(χ) = χ³/(χ³+cv1³) closed-form to rtol 1e-14 at six χ points.",
