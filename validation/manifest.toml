  "Sixth benchmark added in v3.64.0: SciMLBase.remake parameter-update contract (test/v_and_v_incompressible_remake.jl) — supports sensitivity + optimization workflows. Seven testsets, 17 gates: (1) remake(; nu) updates nu only; (2) remake(; density) updates density only; (3) both nu + density together; (4) original problem immutable under remake; (5) algorithm swap; (6) chained remakes compose; (7) type preserved across remake.",
  "Seventh benchmark added in v3.100.0: continuity-residual + Courant-number primitives (test/v_and_v_continuity.jl). Nine testsets, 12 gates: (1) phi ≡ 0 ⇒ continuity_residual = 0 exactly; (2) phi ≡ 0 ⇒ continuity_residual_interior = 0 exactly; (3) L¹ norm ≥ 0 on non-trivial flux + interior ≤ full residual; (4) flux-linear scaling (doubling phi doubles residual rtol 1e-14); (5) single internal-face flux identity — imbalance on owner and neighbour equals |phi_f| each ⇒ total residual = 2·|phi_f| (here 1.0 rtol 1e-14); (6) wider interior band shrinks the interior residual (monotone in boundary_band); (7) compute_max_courant(phi ≡ 0) = 0 exactly; (8) Co_max ∝ dt (halving dt halves Co_max rtol 1e-14); (9) sign-symmetric — flipping phi sign does not change max|phi|·dt/V.",
  "Evidence #8 (v3.102.0): pressure-based compressible SIMPLE/PIMPLE landed in `src/pressure_based/compressible_{simple,pimple}.jl` with EOS coupling, ideal-gas + real-gas (Peng-Robinson, Redlich-Kwong) + tabulated CoolProp dispatch, and non-Newtonian rheology (`src/pressure_based/rheology.jl`: power-law, Bird-Carreau, Herschel-Bulkley, Casson). Smoke-tested only — published benchmarks against rhoSimpleFoam analytical cases (Sod-tube, isentropic compressor) are a v3.2 follow-up before stable promotion.",
