name: docs-quality

on:
  # Auto-trigger cut 2026-05. Fire manually for link/spell sweeps.
  workflow_dispatch:

jobs:
  link-check:
    name: lychee link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Note: lychee 0.24+ removed `--exclude-mail` (mailto links are
          # now skipped by default; opt in with `--include-mail`).
          args: >-
            --config .lychee.toml
            --no-progress
            --exclude-path docs/build
            --exclude-path docs/src/assets
            'docs/**/*.md' 'theory/**/*.qmd' '*.md'
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}

  spell-check:
    name: cspell typo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: streetsidesoftware/cspell-action@v6
        with:
          config: .cspell.json
          files: |
            docs/**/*.md
            theory/**/*.qmd
            *.md
          incremental_files_only: false
          strict: true
