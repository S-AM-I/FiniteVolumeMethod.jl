name: benchmarks

# Manual-trigger allocation-budget regression lane. This workflow is
# NOT a gating lane: it only runs when dispatched from the Actions tab
# (auto-trigger was cut 2026-05 and has not been re-enabled).
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  alloc-budget:
    name: Allocation-budget regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Resolve benchmarks env
        run: |
          julia --project=benchmarks -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - name: Run benchmarks (compare against baseline)
        run: julia --project=benchmarks benchmarks/runbenchmarks.jl --compare
