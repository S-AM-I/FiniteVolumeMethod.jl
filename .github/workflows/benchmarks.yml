name: benchmarks

# Gating lane — fires on every push to main and on every PR.
# Promoted from the manual-trigger / paths-filtered scaffold once the
# baseline stabilized.
on:
  # Auto-trigger cut 2026-05. Fire manually from the Actions tab
  # when an allocation regression check is needed.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  alloc-budget:
    name: Allocation-budget regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Resolve benchmarks env
        run: |
          julia --project=benchmarks -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - name: Run benchmarks (compare against baseline)
        run: julia --project=benchmarks benchmarks/runbenchmarks.jl --compare
