name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
env:
  # Bypass Julia Pkg server to avoid transient 404 errors
  JULIA_PKG_SERVER: ""
# =====================================================================
# CI Lane Structure (ASME V&V 20-2009 Alignment)
# =====================================================================
# Lane 1 — core:               Unit tests, Aqua, imports, governance
#                               (runs in the 'test' job below)
# Lane 2 — scientific-evidence: Fast representative V&V cases
#                               (runs in the 'scientific-evidence' job)
#                               Generates validation report artifact.
# Lane 3 — nightly:            Broader convergence sweeps, heavy
#                               MHD/AMR/GRMHD cases.
#                               (runs in Nightly.yml on schedule)
# Lane 4 — release:            Full evidence suite + generated
#                               validation report artifact.
#                               (runs in Release.yml on tag push)
#
# The docs job depends on both test and scientific-evidence completing.
#
# Reference Test Baseline Policy:
#   JULIA_REFERENCETESTS_UPDATE=true is acceptable for IMAGE regression
#   tests (visual aids that are not part of the scientific contract).
#   All NUMERICAL acceptance criteria (convergence rates, error norms,
#   conservation residuals) must use fixed @test assertions that cannot
#   be auto-updated. Evidence-tier cases declared in manifest.toml with
#   explicit thresholds are the authoritative acceptance criteria.
# =====================================================================
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
          - 'pre'
          - 'lts'
        os:
          - ubuntu-latest
        arch:
          - x64
    continue-on-error: ${{ matrix.version == 'pre' }}
    steps:
      - name: Increase swapfile
        run: |
          sudo swapoff -a
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show
      - name: Checkout repository for access
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - name: Cache artifacts, etc.
        uses: julia-actions/cache@v2

      - name: Build the package
        uses: julia-actions/julia-buildpkg@v1

      - name: Run the tests
        uses: julia-actions/julia-runtest@v1
        env:
          JULIA_REFERENCETESTS_UPDATE: true

      - name: Process the coverage
        if: always()
        uses: julia-actions/julia-processcoverage@v1

      - name: Upload the resutls
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
  scientific-evidence:
    name: Scientific Evidence
    runs-on: ubuntu-latest
    steps:
      - name: Increase swapfile
        run: |
          sudo swapoff -a
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Instantiate test environment
        run: |
          julia --project=test -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - name: Run scientific evidence suite
        run: julia --project=test test/scientific_evidence.jl
      - name: Generate validation report
        if: always()
        run: |
          julia --project=test -e '
            include("validation/generate_report.jl")
            ValidationReport.generate(
              joinpath("validation", "manifest.toml"),
              "validation_report.md",
            )'
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation_report.md
  docs:
    name: Documentation
    needs: [test, scientific-evidence]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      statuses: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Increase swapfile
        run: |
          sudo swapoff -a
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Install docs dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - name: Build documentation
        run: julia --project=docs docs/make.jl
        env:
          FVM_DOCS_EXECUTION: subset
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
