name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
env:
  JULIA_PKG_SERVER: ""
# =====================================================================
# Research CI Lane Structure
# =====================================================================
# Lane 1 — environment-integrity: direct dependency declarations and
#                                 project hygiene for test/docs
# Lane 2 — unit-interop:         package tests, Aqua, explicit imports,
#                                 SciML interoperability smoke coverage
# Lane 3 — scientific-smoke:     fast representative scientific evidence
#                                 plus validation report artifact
# Lane 4 — nightly/release:      broader evidence in dedicated workflows
# =====================================================================
jobs:
  environment-integrity:
    name: Environment Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Cache artifacts, etc.
        uses: julia-actions/cache@v3
      - name: Instantiate test environment
        run: |
          julia --project=test -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - name: Check test project integrity
        run: julia --project=test test/environment_integrity.jl
      - name: Instantiate docs environment
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - name: Check docs project integrity
        run: julia --project=docs docs/environment_integrity.jl

  unit-interop:
    name: Unit / API / Interop - Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    needs: [environment-integrity]
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
          - 'lts'
          - 'pre'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - name: Increase swapfile
        run: |
          sudo swapoff -a
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - name: Cache artifacts, etc.
        uses: julia-actions/cache@v3
      - name: Build the package
        uses: julia-actions/julia-buildpkg@v1
      - name: Run the tests
        uses: julia-actions/julia-runtest@v1
        env:
          JULIA_REFERENCETESTS_UPDATE: true
      - name: Process the coverage
        if: matrix.version == '1' && always()
        uses: julia-actions/julia-processcoverage@v1
      - name: Upload coverage results
        if: matrix.version == '1' && always()
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info

  scientific-smoke:
    name: Scientific Smoke
    runs-on: ubuntu-latest
    needs: [environment-integrity]
    steps:
      - name: Increase swapfile
        run: |
          sudo swapoff -a
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate test environment
        run: |
          julia --project=test -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - name: Run scientific evidence suite
        run: julia --project=test test/scientific_evidence.jl
      - name: Generate validation report
        if: always()
        run: |
          julia --project=test -e '
            include("validation/generate_report.jl")
            ValidationReport.generate(
              joinpath("validation", "manifest.toml"),
              "validation_report.md",
            )'
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation_report.md

  published-benchmarks:
    name: Published Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [unit-interop]
    steps:
      - name: Increase swapfile
        run: |
          sudo swapoff -a
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate test environment
        run: |
          julia --project=test -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - name: Run published benchmarks
        env:
          FVM_RUN_BENCHMARKS: "true"
        run: |
          julia --project=test -e '
            include("test/benchmarks/harness.jl")
            include("test/benchmarks/sod_shock_tube.jl")
            include("test/benchmarks/moser_re180.jl")
            include("test/benchmarks/martin_moyce_dam_break.jl")
            include("test/benchmarks/ghia_re400.jl")
            include("test/benchmarks/rayleigh_benard_1e4.jl")
          '

  docs:
    name: Documentation
    needs: [environment-integrity, unit-interop, scientific-smoke]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      statuses: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Increase swapfile
        run: |
          sudo swapoff -a
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - name: Install docs dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - name: Build documentation
        run: julia --project=docs docs/make.jl
        env:
          FVM_DOCS_EXECUTION: subset
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
